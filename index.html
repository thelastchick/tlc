<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLC Music Player</title>
    <style>
        /* ========================================= */
        /* TLC MUSIC PLAYER STYLES (NEON GLASS)      */
        /* ========================================= */
        .tlc-music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 310px;
            background: rgba(16, 18, 22, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 
                        0 0 15px rgba(255, 215, 0, 0.15);
            z-index: 9999;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            direction: ltr; /* جهت قرارگیری المان‌های پلیر */
        }

        .player-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .cover-art {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            flex-shrink: 0;
        }

        .cover-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cover-art img.rotating {
            animation: rotateCover 8s linear infinite;
        }

        @keyframes rotateCover {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .track-info h4 {
            margin: 0;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .track-info p {
            margin: 3px 0 0 0;
            color: #ffd700;
            font-size: 11px;
            opacity: 0.85;
        }

        /* اکولایزر متحرک */
        .equalizer-bars {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 32px;
            margin: 10px 0;
            padding: 0 4px;
        }

        .equalizer-bars .bar {
            width: 4px;
            height: 6px;
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            border-radius: 3px;
            transition: height 0.2s ease;
        }

        .equalizer-bars.active .bar {
            animation: eqBounce 1.2s infinite ease-in-out alternate;
        }

        .equalizer-bars.active .bar:nth-child(1) { animation-delay: 0.1s; }
        .equalizer-bars.active .bar:nth-child(2) { animation-delay: 0.4s; }
        .equalizer-bars.active .bar:nth-child(3) { animation-delay: 0.2s; }
        .equalizer-bars.active .bar:nth-child(4) { animation-delay: 0.5s; }
        .equalizer-bars.active .bar:nth-child(5) { animation-delay: 0.3s; }
        .equalizer-bars.active .bar:nth-child(6) { animation-delay: 0.6s; }
        .equalizer-bars.active .bar:nth-child(7) { animation-delay: 0.2s; }
        .equalizer-bars.active .bar:nth-child(8) { animation-delay: 0.5s; }
        .equalizer-bars.active .bar:nth-child(9) { animation-delay: 0.1s; }
        .equalizer-bars.active .bar:nth-child(10) { animation-delay: 0.4s; }
        .equalizer-bars.active .bar:nth-child(11) { animation-delay: 0.3s; }
        .equalizer-bars.active .bar:nth-child(12) { animation-delay: 0.6s; }

        @keyframes eqBounce {
            0% { height: 6px; }
            100% { height: 28px; box-shadow: 0 0 8px rgba(255, 215, 0, 0.8); }
        }

        /* نوار زمان */
        .progress-area input[type="range"] {
            width: 100%;
            accent-color: #ffd700;
            cursor: pointer;
            height: 4px;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            color: #8a8f99;
            font-size: 10px;
            margin-top: 4px;
        }

        /* کنترل‌ها */
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 10px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #a0a5b1;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .ctrl-btn:hover {
            color: #ffd700;
        }

        .play-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700 0%, #ff9900 100%);
            border: none;
            color: #000;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 22px rgba(255, 215, 0, 0.8);
        }
    </style>
</head>
<body style="background-color: #0a0b0d; margin: 0; min-height: 100vh;">

    <!-- ========================================= -->
    <!-- TLC NEON EQUALIZER MUSIC PLAYER           -->
    <!-- ========================================= -->
    <div class="tlc-music-player">
        <div class="player-top">
            <div class="cover-art">
                <img src="assets/tlc-loader.png" alt="TLC Cover" id="playerCover">
            </div>
            <div class="track-info">
                <h4>THE LAST CHICK</h4>
                <p>Official Theme Track</p>
            </div>
        </div>

        <!-- اکولایزر متحرک -->
        <div class="equalizer-bars" id="eqContainer">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <!-- نوار پیشرفت -->
        <div class="progress-area">
            <input type="range" id="progressBar" value="0" min="0" max="100">
            <div class="time-display">
                <span id="currentTime">00:00</span>
                <span id="durationTime">00:00</span>
            </div>
        </div>

        <!-- دکمه‌های کنترل -->
        <div class="player-controls">
            <button class="ctrl-btn" id="prevBtn">⏮</button>
            <button class="play-btn" id="mainPlayBtn">
                <span id="playIcon">▶</span>
            </button>
            <button class="ctrl-btn" id="nextBtn">⏭</button>
        </div>

        <!-- فایل صوتی (مسیر فایل صوتی خود را جایگزین کنید) -->
        <audio id="tlcAudio" src="assets/music.mp3" preload="metadata"></audio>
    </div>

    <script>
        const audio = document.getElementById('tlcAudio');
        const playBtn = document.getElementById('mainPlayBtn');
        const playIcon = document.getElementById('playIcon');
        const eqContainer = document.getElementById('eqContainer');
        const playerCover = document.getElementById('playerCover');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        // پخش / توقف
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.textContent = '❚❚';
                eqContainer.classList.add('active');
                playerCover.classList.add('rotating');
            } else {
                audio.pause();
                playIcon.textContent = '▶';
                eqContainer.classList.remove('active');
                playerCover.classList.remove('rotating');
            }
        });

        // به‌روزرسانی نوار پیشرفت و زمان
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progressPercent;
                
                let curMin = Math.floor(audio.currentTime / 60);
                let curSec = Math.floor(audio.currentTime % 60);
                if (curSec < 10) curSec = `0${curSec}`;
                currentTimeEl.textContent = `${curMin}:${curSec}`;

                let durMin = Math.floor(audio.duration / 60);
                let durSec = Math.floor(audio.duration % 60);
                if (durSec < 10) durSec = `0${durSec}`;
                durationTimeEl.textContent = `${durMin}:${durSec}`;
            }
        });

        // جابه‌جایی در زمان موزیک با اسلایدر
        progressBar.addEventListener('input', () => {
            const seekTime = (progressBar.value / 100) * audio.duration;
            audio.currentTime = seekTime;
        });
    </script>
</body>
</html>
