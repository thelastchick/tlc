    <meta name="twitter:image" content="https://thelastchick.com/assets/tlc1.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .shop-page {
            min-height: calc(100vh - 200px);
            padding: 160px 20px 80px;
            text-align: center;
            background: #050505;
        }
        .shop-hero {
            max-width: 720px;
            margin: 0 auto;
        }
        .shop-hero .shop-icon-wrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #16181d 0%, #0c0d0f 100%);
            border: 1px solid rgba(255, 215, 0, 0.55);
            box-shadow: 0 0 28px rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }
        .shop-hero .shop-icon-wrap svg {
            width: 40px;
            height: 40px;
        }
        .shop-hero h1 {
            font-size: 42px;
            color: #ffd700;
            margin-bottom: 12px;
            text-shadow: 0 0 18px rgba(255, 215, 0, 0.35);
        }
        .shop-hero .shop-sub {
            color: #a0a5b1;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 36px;
        }
        .shop-card {
            max-width: 520px;
            margin: 0 auto 32px;
            padding: 36px 28px;
            background: linear-gradient(145deg, #16181d 0%, #0c0d0f 100%);
            border: 1px solid rgba(255, 204, 0, 0.35);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65);
        }
        .shop-card h2 {
            font-size: 26px;
            color: #ffd700;
            margin-bottom: 14px;
        }
        .shop-card p {
            color: #a0a5b1;
            font-size: 15px;
            line-height: 1.7;
            margin: 0 auto;
            max-width: 420px;
        }
        .shop-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 12px 24px;
            background: #ffd700;
            color: #000 !important;
            font-weight: 700;
            border-radius: 30px;
            text-decoration: none;
            transition: 0.25s;
        }
        .shop-back:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
        @media (max-width: 600px) {
            .shop-page { padding-top: 120px; }
            .shop-hero h1 { font-size: 32px; }
            .shop-card { padding: 28px 18px; }
        }
    </style>
</head>
<body>

<div id="tlc-ambient-particles" aria-hidden="true">

            <span></span><span></span><span></span>

    </div>
</header>

<main class="shop-page">
    <div class="shop-hero">
        <div class="shop-icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            </svg>
        </div>
        <h1 data-i18n="shop_page_title">TLC Shop</h1>
        <p class="shop-sub" data-i18n="shop_page_subtitle">Official merch and collectibles from The Last Chick community.</p>

        <div class="shop-card">
            <h2 data-i18n="shop_coming_soon">Coming Soon</h2>
            <p data-i18n="shop_coming_desc">Our official store is being prepared. Stay tuned for exclusive TLC merch, collectibles and more.</p>
        </div>

        <a href="/" class="shop-back" data-i18n="shop_back_home">Back to Home</a>

<footer>
